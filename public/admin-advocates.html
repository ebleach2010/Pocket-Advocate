<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#0A0A0C">
<title>Advocates · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : '#0A0A0C');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp16">
<link rel="stylesheet" href="/css/admin.css?v=stat138">
<link rel="stylesheet" href="/css/look.css?v=7">
<script type="module" src="/js/nav-menu.js"></script>
<style>
  /* His Advocates tab (2026-10-15): add an advocate, and look after each one. */
  .adv-add { display: grid; gap: .6rem; margin: 0 0 1.4rem; }
  .adv-add label { display: grid; gap: .25rem; font-size: .9rem; }
  .adv-add input { min-height: 44px; }
  .adv-list { display: grid; gap: .8rem; }
  .adv-card { display: grid; gap: .5rem; }
  .adv-top { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: baseline; justify-content: space-between; }
  .adv-top h3 { margin: 0; }
  .adv-meta { display: flex; flex-wrap: wrap; gap: .35rem .9rem; color: var(--dim); font-size: .86rem; }
  .adv-acts { display: flex; flex-wrap: wrap; gap: .5rem; }
  .adv-acts .btn { min-height: 44px; }
  .adv-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .adv-row input[type="number"] { width: 6rem; min-height: 44px; }
  .pill-off { opacity: .7; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/admin.html">Clients</a>
      <a href="/admin-leads.html">Leads</a>
      <a href="/admin-calendar.html">Calendar</a>
      <a href="/admin-chats.html">Chats</a>
      <a href="/admin-availability.html">Availability</a>
      <a href="/admin-dictionary.html">📚 Terms</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <!-- ADVOCATES (Eric, 2026-10-15: "Admin creates advocate accounts from the
       admin dashboard... Admin enters the email/password when creating the
       account... Admin should be able to reset an advocate password later for
       technical support."). Built from /api/admin/advocates. -->
  <h1>Advocates</h1>
  <form class="panel adv-add" id="adv-add" autocomplete="off">
    <h3 style="margin:0;">Add an advocate</h3>
    <label>Their name<input type="text" name="name" required maxlength="80" autocomplete="off"></label>
    <label>Their email<input type="email" name="email" required autocomplete="off"></label>
    <label>A first password for them<input type="text" name="password" required minlength="10" autocomplete="new-password" spellcheck="false"></label>
    <p class="dim small" style="margin:0;">They get an email saying the account is ready. Give them this password yourself: it is never emailed, shown again or kept as you typed it. They choose their own the first time they sign in.</p>
    <div class="adv-row"><button type="submit" class="btn glow">Create their account</button><span class="dim small" id="adv-said" role="status"></span></div>
  </form>
  <div id="adv-list" class="adv-list"><p class="dim">Loading…</p></div>
</main>
<script type="module" src="/js/admin-advocates.js"></script>
<script type="module" src="/js/admin-presence.js"></script>
</body>
</html>
