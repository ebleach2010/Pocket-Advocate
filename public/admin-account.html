<title>My account · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : '#0A0A0C');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>

<style>
  /* An advocate's own account and setup (2026-10-15), and his profile. */
  .acct { display: grid; gap: 1rem; }
  .acct form, .acct section { display: grid; gap: .6rem; }
  .acct label { display: grid; gap: .25rem; font-size: .9rem; }
  .acct input[type="text"], .acct input[type="password"], .acct select, .acct textarea { min-height: 44px; }
  .acct textarea { min-height: 9rem; resize: vertical; }
  .acct .row-btn { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .acct .row-btn .btn { min-height: 44px; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chips label { display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 .8rem;
    border: 1px solid var(--line); border-radius: 999px; font-size: .88rem; cursor: pointer; }
  .chips input { width: 1.1rem; height: 1.1rem; }
  .headshot { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
  .headshot img, .headshot .blank { width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; color: var(--dim); font-size: .8rem; }
  .steps { margin: 0; padding-left: 1.2rem; color: var(--dim); font-size: .9rem; }
  .steps .done { color: var(--ink); text-decoration: line-through; text-decoration-color: var(--dim); }
  .toggle { display: flex !important; grid-auto-flow: column; align-items: center; gap: .6rem; min-height: 44px; }
  .toggle input { width: 1.3rem; height: 1.3rem; }
</style>
