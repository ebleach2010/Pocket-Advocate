<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/pa-icon-192.png">
<link rel="apple-touch-icon" href="/img/pa-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">

<title>Employer mode · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    // Warm is the look everywhere; blue and purple is a choice in Settings
    // (Eric, 2026-10-16: "Warm gradient we have going on should be default
    // everywhere, with the blue/purple being in settings").
    var cool = localStorage.getItem('pa-look') === 'cool';
    if (cool) document.documentElement.dataset.look = 'cool';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : cool ? '#0A0A0C' : '#1E1519');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp17">
<link rel="stylesheet" href="/css/admin.css?v=stat139">

<style>
  /* Employer mode (2026-10-15): his team at a glance, and the way into each. */
  .emp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .emp-head h1 { margin: 0; }
  .emp-back { font-weight: 600; }
  .emp-tabs { display: flex; gap: .4rem; margin: .9rem 0 1rem; }
  /* One line each at 320 (2026-10-17): "Pay history" wrapped and grew all three. */
  .emp-tabs button { min-height: 44px; padding: .4rem clamp(.6rem, 3vw, 1rem); white-space: nowrap; border-radius: 999px; border: 1px solid var(--edge-base); background: var(--sur-base); color: var(--soft); font: inherit; font-weight: 700; cursor: pointer; }
  .emp-tabs button.on { border-color: var(--cyan); color: var(--ink); box-shadow: 0 0 0 1px color-mix(in srgb, var(--cyan) 35%, transparent); }
  .team { display: grid; gap: .8rem; }
  .tm-card { display: grid; gap: .6rem; }
  .tm-head { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: .8rem; align-items: start; }
  .tm-face { position: relative; width: 56px; height: 56px; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; }
  .tm-face:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .tm-edit { position: absolute; right: -3px; bottom: -3px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--sur-lit); border: 1px solid var(--edge-lit); color: var(--ink); font-size: .72rem; line-height: 1; }
  .tm-top { display: flex; align-items: center; gap: .8rem; }
  .tm-photo { flex: none; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--edge-lit); background: var(--sur-lit); }
  .tm-init { flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--warm-pop, linear-gradient(135deg, #3DDCF5, #B9A6FF)); color: #02161A; font: 700 1.2rem/1 'Sora', 'Manrope', system-ui, sans-serif; }
  .tm-name { display: block; margin: 0; font: 600 1.1rem/1.25 'Sora', 'Manrope', system-ui, sans-serif; }
  .tm-sub { display: block; margin: .1rem 0 0; color: var(--dim); font-size: .86rem; }
  .tm-brief { display: block; margin: 0; color: var(--soft); }
  /* A tap on their name and clients opens their cases (2026-10-16). */
  .tm-open { display: grid; gap: .6rem; color: inherit; text-decoration: none; border-radius: 12px; margin: -.3rem; padding: .3rem; }
  .tm-open:hover .tm-name, .tm-open:focus-visible .tm-name { color: var(--cyan); }
  .tm-open:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .tm-go { margin-left: auto; color: var(--dim); font-size: 1.6rem; line-height: 1; }
  .tm-money { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .tm-money strong { font: 600 1.6rem/1.1 'Sora', 'Manrope', system-ui, sans-serif; background: var(--warm-pop, linear-gradient(110deg, #3DDCF5 0%, #9BEBFA 48%, #B9A6FF 100%)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tm-money span { color: var(--dim); font-size: .86rem; }
  .tm-acts { display: flex; flex-wrap: wrap; gap: .5rem; }
  .tm-acts .btn { min-height: 44px; position: relative; }
  /* Buttons that read as buttons on the dark cards (Eric, 2026-10-16: "the
     buttons are dark. They should have some contrast."). */
  /* In the look's own accent (2026-10-16): peach when warm, cyan when blue and green.
     Written to outweigh look.css's plain raised fill (2026-10-17), so these keep
     their accent and wear the raise's shadows over it. */
  :root main .btn.quiet:not(.glow, .danger, .secondary, .on, :disabled) { background: color-mix(in srgb, var(--cyan) 12%, transparent); border-color: color-mix(in srgb, var(--cyan) 60%, transparent); color: var(--ink); font-weight: 700; }
  :root main .btn.quiet:not(.glow, .danger, .secondary, .on, :disabled):is(:hover, :focus-visible) { background: color-mix(in srgb, var(--cyan) 22%, transparent); border-color: var(--cyan); color: var(--ink); }
  .tm-badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: #FF7A7A; color: #1A0505; font: 800 .72rem/20px 'Manrope', system-ui, sans-serif; text-align: center; }
  .tm-pill { display: inline-block; margin-left: .35rem; padding: .05rem .5rem; border-radius: 999px; border: 1px solid var(--edge-lit); color: var(--soft); font-size: .72rem; font-weight: 800; letter-spacing: .06em; vertical-align: middle; }
  .tm-pill.sample { border-color: rgba(242, 193, 78, .6); color: #F2C14E; }
  /* Their photo and bio, from him (2026-10-15). The photo is shown whole. */
  /* One Team page (2026-10-16): the accounts the Advocates tab used to hold. */
  .tm-head { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center; margin: 0 0 .9rem; }
  .tm-head .btn { min-height: 44px; }
  .tm-off-h { margin: 1.2rem 0 .5rem; font-size: .8rem; letter-spacing: .14em; color: var(--dim); }
  .adv-card { display: grid; gap: .5rem; }
  .adv-top { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: baseline; justify-content: space-between; }
  .adv-top h3 { margin: 0; }
  .adv-acts { display: flex; flex-wrap: wrap; gap: .5rem; }
  .adv-acts .btn { min-height: 44px; }
  .adv-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .adv-row input[type="number"] { width: 6rem; min-height: 44px; }
  .pill-off { opacity: .7; }
  .tm-sheet .ask-form { display: grid; gap: .7rem; }
  .tm-sheet label.dim { display: grid; gap: .3rem; }
  .tm-sheet textarea.ask-input { min-height: 7.5rem; resize: vertical; font: inherit; }
  .tm-pic { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
  .tm-pic img { width: 96px; height: auto; max-height: 120px; object-fit: contain; border-radius: 14px; border: 1px solid var(--edge-lit); background: var(--sur-lit); }
  .tm-pick { min-height: 44px; display: inline-flex; align-items: center; cursor: pointer; }
  /* His side of the temporary chat: the same white box they see. */
  /* Payroll, the Mangomint way (2026-10-15). */
  .pr-form { display: grid; gap: .8rem; }
  .pr-presets { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0; padding: 0; border: 0; }
  .pr-presets legend { padding: 0; margin-bottom: .4rem; font-weight: 700; }
  .pr-presets label { flex: 1 1 calc(50% - .4rem); display: inline-flex; align-items: center; gap: .45rem; min-height: 44px; padding: 0 .9rem; border: 1px solid var(--edge-base); border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .pr-presets label:has(input:checked) { border-color: var(--cyan); color: var(--ink); box-shadow: 0 0 0 1px color-mix(in srgb, var(--cyan) 35%, transparent); }
  .pr-presets input { accent-color: var(--cyan); }
  .pr-dates { display: flex; flex-wrap: wrap; gap: .6rem; }
  .pr-dates label { display: grid; gap: .25rem; font-size: .88rem; }
  .pr-dates input { min-height: 44px; }
  .pr-opt { display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; }
  .pr-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; justify-content: space-between; margin: 1.2rem 0 .6rem; }
  .pr-head h2 { margin: 0; font-size: 1.15rem; }
  .pr-acts { display: flex; flex-wrap: wrap; gap: .5rem; }
  .pr-acts .btn { min-height: 44px; }
  .pr-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--edge-base); border-radius: 14px; }
  table.pr { width: max-content; min-width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
  table.pr th, table.pr td { padding: .6rem .7rem; border-bottom: 1px solid var(--edge-quiet); text-align: right; white-space: nowrap; }
  table.pr th { color: var(--dim); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; background: var(--sur-lit); }
  table.pr th:first-child, table.pr td:first-child { position: sticky; left: 0; text-align: left; background: var(--sur-base); z-index: 1; }
  table.pr th:first-child { background: var(--sur-lit); }
  table.pr tr.pr-total td { font-weight: 800; border-top: 2px solid var(--edge-lit); }
  /* The total with the sample counted (2026-10-16), in her gold. */
  table.pr tr.pr-with td { border-top: 1px dashed rgba(242, 193, 78, .6); color: #F2C14E; }
  table.pr button.pr-amt { min-height: 36px; padding: .2rem .55rem; border: 1px solid transparent; border-radius: 10px; background: none; color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
  table.pr button.pr-amt:hover, table.pr button.pr-amt:focus-visible { border-color: var(--cyan); }
  table.pr button.pr-plus { min-width: 36px; min-height: 36px; margin-left: .3rem; border: 1px solid var(--edge-lit); border-radius: 10px; background: var(--sur-lit); color: var(--ink); font: 700 1rem/1 inherit; cursor: pointer; }
  table.pr button.pr-who { min-height: 36px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; text-align: left; }
  table.pr td.pr-detail { text-align: left; white-space: normal; background: var(--sur-quiet); }
  .pr-lines { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .pr-lines td { padding: .35rem .4rem; border-bottom: 1px solid var(--edge-quiet); text-align: left; white-space: nowrap; }
  .pr-lines td.n { text-align: right; }
  .pr-neg { color: #FF9A9A; }
  .pr-chip { display: inline-block; padding: .05rem .5rem; border-radius: 999px; border: 1px solid var(--edge-lit); font-size: .72rem; font-weight: 800; letter-spacing: .06em; }
  .pr-chip.draft { border-color: rgba(242, 193, 78, .6); color: #F2C14E; }
  .pr-chip.done { border-color: rgba(79, 214, 156, .6); color: #4FD69C; }
  .pr-note { margin: .6rem 0 0; color: var(--dim); font-size: .84rem; }
  .pr-list { display: grid; gap: .5rem; margin: 1rem 0 0; }
  .pr-item { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; justify-content: space-between; }
  /* PAY HISTORY, A FOLDER A MONTH (Eric, 2026-10-15: "When I press 'paid,'
     the spreadsheet gets put in a folder for that month."). Manila, like the
     files on the Clients shelf. */
  .pr-folder { position: relative; margin: 1.6rem 0 .4rem; border-radius: 4px 16px 16px 16px; background: #DEC791; color: #2A2113; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); }
  .pr-folder::before { content: ""; position: absolute; top: -13px; left: 0; width: 44%; height: 15px; border-radius: 12px 12px 0 0; background: #DEC791; }
  .pr-folder > summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .3rem .8rem; min-height: 52px; padding: .8rem 1rem; list-style: none; cursor: pointer; }
  .pr-folder > summary::-webkit-details-marker { display: none; }
  .pr-folder > summary:focus-visible { outline: 2px solid #2A2113; outline-offset: 3px; border-radius: 12px; }
  .pr-month { font: 700 1.05rem/1.2 'Sora', 'Manrope', system-ui, sans-serif; }
  .pr-folder-sum { font-weight: 700; font-size: .9rem; color: #4A3B20; }
  .pr-folder .pr-list { margin: 0; padding: 0 .7rem .8rem; }
  .pr-folder .pr-item { padding: .7rem .8rem; border: 1px solid #A98F5F; border-radius: 12px; background: #F0DFB0; color: #2A2113; }
  .pr-folder .pr-item .btn { color: #2A2113; border-color: #A98F5F; background: #FFF6DC; }
  .pr-folder .pr-chip.done { border-color: #2E7D57; color: #1F5E3F; }
  .pr-folder .pr-chip { border-color: #A98F5F; color: #4A3B20; }

  /* THE WHOLE REPORT ON A PHONE (Eric, 2026-10-15: "Payroll chart should not
     be cut off. The whole spreadsheet should be visible once run."). Under
     760px each person is a card holding every column, labelled, and the
     totals are the last card; nothing scrolls sideways. Wider, it is the
     spreadsheet. */
  @media (max-width: 760px) {
    .pr-scroll { overflow: visible; border: 0; border-radius: 0; }
    table.pr, table.pr tbody { display: block; width: 100%; min-width: 0; }
    table.pr thead { display: none; }
    table.pr tr[data-row], table.pr tr.pr-total { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; margin: 0 0 .6rem; padding: .75rem .9rem; border: 1px solid var(--edge-base); border-radius: 14px; background: var(--sur-base); }
    table.pr tr.pr-total { border-color: var(--edge-lit); background: var(--sur-lit); }
    table.pr tr[data-row] td, table.pr tr.pr-total td { position: static; display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .4rem 0; border: 0; border-bottom: 1px solid var(--edge-quiet); background: none; white-space: normal; text-align: right; }
    table.pr td[data-label]::before { content: attr(data-label); color: var(--dim); font-size: .76rem; font-weight: 700; text-align: left; }
    table.pr tr[data-row] td:first-child, table.pr tr.pr-total td:first-child { grid-column: 1 / -1; display: block; padding: 0 0 .4rem; font-size: 1rem; text-align: left; }
    table.pr td[data-label] > span { display: inline-flex; align-items: center; justify-content: flex-end; gap: .45rem; text-align: right; }
    table.pr td[data-label] button.pr-plus { margin-left: 0; }
    table.pr td.pr-pay-cell > span { flex-direction: column; align-items: flex-end; gap: 0; }
    table.pr tr.pr-total td:first-child { font: 700 1rem/1.2 'Sora', 'Manrope', system-ui, sans-serif; }
    table.pr td.pr-tot-cell { grid-column: 1 / -1; border-bottom: 0; font-size: 1.15rem; font-weight: 800; }
    table.pr td.pr-pay-cell { grid-column: 1 / -1; border-bottom: 0; }
    table.pr td.pr-pay-cell:empty { display: none; }
    table.pr tr[data-detail]:not([hidden]) { display: block; margin: -.4rem 0 .6rem; }
    table.pr tr[data-detail] td.pr-detail { display: block; padding: .6rem .7rem; border: 1px solid var(--edge-quiet); border-radius: 12px; }
    .pr-lines td { white-space: normal; }
    /* Each line a small card on a phone (2026-10-17): who and what on the
       left, the sale and their pay on the right, so neither runs off. */
    .pr-lines, .pr-lines tbody { display: block; }
    .pr-lines tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "who amt pay" "what amt pay" "day amt pay"; gap: 0 .7rem; padding: .45rem 0; border-bottom: 1px solid var(--edge-quiet); }
    .pr-lines td { padding: 0; border: 0; overflow-wrap: anywhere; }
    .pr-lines td:nth-child(1) { grid-area: day; color: var(--dim); font-size: .76rem; }
    .pr-lines td:nth-child(2) { grid-area: who; font-weight: 700; }
    .pr-lines td:nth-child(3) { grid-area: what; }
    .pr-lines td:nth-child(4) { grid-area: amt; align-self: center; }
    .pr-lines td:nth-child(5) { grid-area: pay; align-self: center; }
    .pr-lines tr.pr-adj td:nth-child(3) { display: none; }
    .pr-lines tr.pr-adj td:nth-child(4) { grid-area: pay; }
    .pr-lines tr.pr-none td { grid-column: 1 / -1; color: inherit; font-size: inherit; }
  }
  @media (max-width: 380px) {
    table.pr tr[data-row], table.pr tr.pr-total { grid-template-columns: 1fr; }
  }
  dialog.sc-sheet { width: min(30rem, calc(100vw - 32px)); margin: auto; padding: 0; border: 0; border-radius: 18px; background: #FFFFFF; color: #16161A; box-shadow: 0 24px 70px rgba(0, 0, 0, .6); }
  dialog.sc-sheet::backdrop { background: rgba(0, 0, 0, .6); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/admin.html">Clients</a>
      <a href="/admin-leads.html">Leads</a>
      <a href="/admin-calendar.html">Calendar</a>
      <a href="/admin-chats.html">Chats</a>
      <a href="/admin-dictionary.html">📚 Terms</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <!-- EMPLOYER MODE (Eric, 2026-10-15: "I (and only I) need a button to enter
       employer mode. This is where I can see all current employees (including
       myself) with a short brief of how many cases they're handling and if
       what type, and their current proposed income from clients they have
       retained."). Built from /api/admin/team, which answers him alone. -->
  <div class="emp-head">
    <h1>Employer mode</h1>
    <a class="emp-back" href="/admin.html">&#8249; Clients</a>
  </div>
  <div class="emp-tabs" role="tablist">
    <button type="button" role="tab" class="on" aria-selected="true" data-emp-tab="team">Team</button>
    <button type="button" role="tab" aria-selected="false" data-emp-tab="payroll">Payroll</button>
    <button type="button" role="tab" aria-selected="false" data-emp-tab="history">Pay history</button>
  </div>
  <section data-emp-page="team">
    <!-- ONE TEAM PAGE (Eric, 2026-10-15: "remove redundancy"). The Advocates
         tab listed these same people; adding one starts here, and each
         card's Account holds their share, password and turning them off. -->
    <div class="tm-head">
      <button type="button" class="btn quiet" data-add-adv>Add an advocate</button>
      <span class="dim small" id="adv-said" role="status"></span>
    </div>
    <div id="team" class="team"><p class="dim">Loading…</p></div>
    <div id="team-off" class="team"></div>
  </section>
  <section data-emp-page="payroll" hidden>
    <!-- Demo mode's practice team (2026-10-16): painted only inside Demo mode. -->
    <div class="panel" id="practice" hidden></div>
    <form class="panel pr-form" id="pr-form">
      <fieldset class="pr-presets">
        <legend>Pay period</legend>
        <label><input type="radio" name="preset" value="week"> Last week</label>
        <label><input type="radio" name="preset" value="twoweeks"> Last 2 weeks</label>
        <label><input type="radio" name="preset" value="month" checked> Last month</label>
        <label><input type="radio" name="preset" value="custom"> Custom</label>
      </fieldset>
      <div class="pr-dates">
        <label>From<input type="date" name="start" required></label>
        <label>To<input type="date" name="end" required></label>
      </div>
      <label class="pr-opt"><input type="checkbox" name="includeAll" checked> Include all staff members</label>
      <button type="submit" class="btn glow">Run report</button>
      <p class="dim small" id="pr-said" role="status" style="margin:0;"></p>
    </form>
    <div id="pr-drafts"></div>
    <div id="pr-report"></div>
  </section>
  <section data-emp-page="history" hidden>
    <div id="pr-history"><p class="dim">Loading…</p></div>
  </section>
</main>
<script type="module" src="/js/admin-employer.js"></script>
<script type="module" src="/js/admin-presence.js"></script>
</body>
</html>
