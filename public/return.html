<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#060A1C">
<title>Payment complete · Pocket Advocate</title>
<script>
// Paint in the stored colour scheme before the stylesheet lands, so a scheme
// never flashes neon on the way in. Mirrors theme.js, which owns the choosing
// and persisting; this only applies what is already stored. Eric's admin
// device keeps Neon by default, everyone else gets Calm, and a stored choice
// always wins.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme');
    if (!s || ['neon', 'calm', 'paper', 'contrast'].indexOf(s) < 0)
      s = localStorage.getItem('pa-admin-device') === '1' ? 'neon' : 'calm';
    if (s !== 'neon') document.documentElement.dataset.scheme = s;
    var c = { neon: '#060A1C', calm: '#0B0E14', paper: '#F3EEE3', contrast: '#000000' }[s];
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && c) m.setAttribute('content', c);
  } catch (e) { /* storage blocked: neon is the default and is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=stat95">
<link rel="stylesheet" href="/css/glowup.css?v=glow1">
<script type="module" src="/js/nav-menu.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/">Book</a>
      <a href="/about.html">About</a>
      <a href="/reviews.html">Reviews</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <h1 id="title">Finishing up…</h1>
  <p class="muted" id="msg">Payment received. I am opening your case now; this usually takes a few seconds.</p>
  <p id="actions" hidden><a class="btn glow" id="case-link" href="/case.html">Go to my case</a></p>
  <p class="muted small" id="reassure" hidden>Nothing is lost, and you will not be charged twice.</p>
</main>
<script type="module">
  import { requireUser, hydrateNav } from '/js/auth.js';

  hydrateNav();
  const user = await requireUser();
  const sessionId = new URLSearchParams(location.search).get('session_id');
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');

  if (user && sessionId) {
    // The case is created by the Stripe webhook, never by this browser —
    // so we poll until it lands (normally 1–5 seconds).
    const started = Date.now();
    const poll = async () => {
      try {
        const idToken = await user.getIdToken();
        const res = await fetch(`/api/case-for-session?session_id=${encodeURIComponent(sessionId)}`, {
          headers: { authorization: `Bearer ${idToken}` },
        });
        const data = await res.json();
        if (data.ready) {
          title.textContent = 'Your case is open';
          msg.textContent = 'Taking you to your case file now…';
          const href = `/case.html?id=${data.caseId}&welcome=1`;
          document.getElementById('case-link').href = href;
          document.getElementById('actions').hidden = false;
          // Straight into the case file — nobody should have to tap a button to
          // reach the thing they just paid for. `replace` keeps this page out of
          // history, so Back from the case doesn't land on a spent checkout.
          location.replace(href);
          return;
        }
      } catch { /* transient — keep polling */ }
      const waited = Date.now() - started;
      // Ninety seconds of "this usually takes a few seconds" is how someone who
      // has just paid decides it did not work and pays again. At ten seconds the
      // page stops claiming it is nearly done and gives them a way out; it goes
      // on polling behind that, so if the case lands they are still taken to it.
      if (waited > 10_000 && document.getElementById('actions').hidden) {
        title.textContent = 'Still working';
        msg.textContent = 'Your payment went through and your case is being set up. This can take a minute. You can wait here, or open My cases whenever you like; it will be there.';
        document.getElementById('actions').hidden = false;
        document.getElementById('reassure').hidden = false;
      }
      if (waited < 90_000) {
        setTimeout(poll, 2500);
      } else {
        title.textContent = 'Almost there';
        msg.textContent = 'Your payment went through, but your case is taking longer than usual to open. Check "My cases" in a minute; it will be there.';
        document.getElementById('actions').hidden = false;
      }
    };
    poll();
  } else if (!sessionId) {
    title.textContent = 'Nothing to finish';
    msg.textContent = 'No checkout session found.';
  }
</script>
</body>
</html>
