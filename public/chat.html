<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/pa-icon-192.png">
<link rel="apple-touch-icon" href="/img/pa-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#0A0A0C">
<!-- Chat is deliberately dark — its own focused space, separate from the rest. -->
<title>Chat · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  // Blue and green past the home (Eric, 2026-10-17: "Change the standard
  // color for clients and advocates past the main page to green/blue that's
  // in settings"). Set first, so it stands even when storage is blocked;
  // Warm is the choice in Settings now.
  document.documentElement.dataset.look = 'cool';
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var cool = localStorage.getItem('pa-look') !== 'warm';
    if (!cool) delete document.documentElement.dataset.look;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : cool ? '#0A0A0C' : '#1E1519');
  } catch (e) { /* storage blocked: Blue and green stands */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp17">
<link rel="stylesheet" href="/css/glowup.css?v=sp9">
<link rel="stylesheet" href="/css/look.css?v=8">
<link rel="stylesheet" href="/css/warm.css?v=5">
<style>
  /* THE BOX ON THE SCREEN (audit, 2026-10-16: on an iPhone the message box
     opened below the bottom edge). The conversation is sized to what is left
     of the screen under it, so the box always shows; chat-page.js sets it. */
  body.chat-page .chat-root:not(.chat-full) .chat-log { max-height: var(--fit-h, 45vh); }
</style>
<script type="module" src="/js/nav-menu.js"></script>
</head>
<body class="chat-page">
<header class="bar">
  <div class="bar-inner" data-always-menu>
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/about.html">About</a>
      <a href="/reviews.html">Reviews</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <div class="row">
    <h1 style="margin:0;">Chat with me</h1>
    <!-- The in/out pill and its "?" are built by office.js, so this page, the
         case page and the subscriber page cannot end up carrying three
         different versions of the same cue. -->
    <span class="office-row" data-office-slot></span>
  </div>
  <div id="switcher" class="case-picker" hidden></div>
  <div id="chat" class="panel" style="margin-top:.8rem;"><p class="dim small">Loading…</p></div>
</main>
<script type="module" src="/js/chat-page.js"></script>
<script type="module" src="/js/version-note.js"></script>
</body>
</html>
