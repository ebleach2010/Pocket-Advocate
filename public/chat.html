<!-- Chat is deliberately dark — its own focused space, separate from the rest. -->
<title>Chat · Pocket Advocate</title>
<script>
// Paint in the stored colour scheme before the stylesheet lands, so a scheme
// never flashes neon on the way in. Mirrors theme.js, which owns the choosing
// and persisting; this only applies what is already stored. Eric's admin
// device keeps Neon by default, everyone else gets Calm, and a stored choice
// always wins.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme');
    if (!s || ['neon', 'calm', 'paper', 'contrast'].indexOf(s) < 0)
      s = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'calm' : 'neon';
    if (s !== 'neon') document.documentElement.dataset.scheme = s;
    var c = { neon: '#EAF2FA', calm: '#0A1626', paper: '#F3EEE3', contrast: '#000000' }[s];
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && c) m.setAttribute('content', c);
  } catch (e) { /* storage blocked: neon is the default and is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp11">
<link rel="stylesheet" href="/css/glowup.css?v=sp5">
<script type="module" src="/js/nav-menu.js"></script>

</header>
<main>
  <div class="row">
    <h1 style="margin:0;">Chat with me</h1>
    <!-- The in/out pill and its "?" are built by office.js, so this page, the
         case page and the subscriber page cannot end up carrying three
         different versions of the same cue. -->
    <span class="office-row" data-office-slot></span>
  </div>
  <div id="switcher" class="case-picker" hidden></div>
  <div id="chat" class="panel" style="margin-top:.8rem;"><p class="dim small">Loading…</p></div>
</main>
<script type="module" src="/js/chat-page.js"></script>
