<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A0A0C">
<title>Not here · Pocket Advocate</title>
<script>
// Black, like every page; somebody who chose High contrast keeps it.
(function () {
  // Blue and green past the home (Eric, 2026-10-17: "Change the standard
  // color for clients and advocates past the main page to green/blue that's
  // in settings"). Set first, so it stands even when storage is blocked;
  // Warm is the choice in Settings now.
  document.documentElement.dataset.look = 'cool';
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var cool = localStorage.getItem('pa-look') !== 'warm';
    if (!cool) delete document.documentElement.dataset.look;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : cool ? '#0A0A0C' : '#1E1519');
  } catch (e) { /* storage blocked: Blue and green stands */ }
})();
</script>
<!-- Every miss gets this page (2026-10-15). It used to be an empty answer,
     which a phone shows as a blank white page with no way out. It is the same
     page for every path, so it says nothing about what does or does not exist.
     Styled inline, so it is never white even if nothing else loads. -->
<style>
  html, body { margin: 0; background: #0A0A0C; color: #F5F5F7; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font: 500 1rem/1.5 'Manrope', -apple-system, 'Segoe UI', system-ui, sans-serif; }
  main { max-width: 26rem; text-align: center; }
  h1 { margin: 0 0 .4rem; font: 600 1.5rem/1.25 'Sora', 'Manrope', system-ui, sans-serif; }
  p { margin: 0 0 1.4rem; color: #C9C9D1; }
  .acts { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.2rem; border-radius: 999px;
    text-decoration: none; font-weight: 700; color: #F5F5F7; border: 1px solid rgba(255, 255, 255, .2); }
  a.go { color: #02161A; border: 0; background: linear-gradient(110deg, #3DDCF5 0%, #9BEBFA 48%, #B9A6FF 100%); }
  a:focus-visible { outline: 2px solid #3DDCF5; outline-offset: 3px; }
</style>
<link rel="stylesheet" href="/css/site.css?v=sp17">
<link rel="stylesheet" href="/css/glowup.css?v=sp9">
<link rel="stylesheet" href="/css/look.css?v=8">
<link rel="stylesheet" href="/css/warm.css?v=5">
<script type="module" src="/js/nav-menu.js"></script>
</head>
<body>
<main>
  <h1>This page isn't here.</h1>
  <p>It may have moved, or you may need to sign in again.</p>
  <div class="acts">
    <a class="go" href="/">Home</a>
    <a href="/signin.html">Sign in</a>
  </div>
</main>
</body>
</html>
