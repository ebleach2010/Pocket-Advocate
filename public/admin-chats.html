<!-- Chat is deliberately dark — its own focused space, separate from the rest. -->
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    // Warm is the look everywhere; blue and purple is a choice in Settings
    // (Eric, 2026-10-16: "Warm gradient we have going on should be default
    // everywhere, with the blue/purple being in settings").
    var cool = localStorage.getItem('pa-look') === 'cool';
    if (cool) document.documentElement.dataset.look = 'cool';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : cool ? '#0A0A0C' : '#1E1519');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>
