<!doctype html>
<html lang="en" data-scheme="calm" data-desk>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#060A13">
<title>PR 420</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/site.css?v=sp15">
<link rel="stylesheet" href="/css/admin.css?v=stat123">
<script type="module" src="/js/nav-menu.js"></script>
</head>
<body>
<canvas id="ambient"></canvas>
<div class="depth-floor"></div>

<header class="top">
  <a class="back" href="/admin.html">&larr; Cases</a>
  <h1 class="crumb">PR 420</h1>
  <button class="cog" id="cog" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main class="app" id="app" hidden>
  <section class="page" data-page="trades" id="pg-trades">
    <header class="title"><div><h1 class="pt fl">TRADES</h1><p class="ps" id="trades-sub">&nbsp;</p></div><span class="slot"><span class="mkt" id="mkt"><span class="dot"></span><span id="mkt-word">Market</span></span></span></header>
    <div class="panel runbox" id="runbox" aria-busy="false">
      <button type="button" class="btn primary run fl" id="run"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg> RUN TRADING DESK</button>
      <div class="runbar" id="runbar" role="progressbar" aria-label="How far the desk run is" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i id="runbar-fill"></i></div>
      <div class="line" id="run-line">Reading the desk&hellip;</div>
      <p class="said" id="run-said"></p>
    </div>
    <div class="panel deskread" id="deskread" hidden><span class="k">The desk</span><span id="deskread-t"></span></div>
    <section id="active-wrap" hidden>
      <h2 class="activehead">Active <span class="n dim" id="active-n"></span></h2>
      <div class="stack" id="active"></div>
    </section>
    <div id="board" style="margin-top:18px"></div>
    <div class="panel empty" id="board-empty" hidden><span id="board-empty-t">No trades yet.</span></div>
    <p class="foot">Ideas, not orders. Every trade is your decision.</p>
  </section>

  <section class="page" data-page="news" id="pg-news" hidden>
    <header class="title"><div><h1 class="pt fl">NEWS</h1><p class="ps" id="news-sub">&nbsp;</p></div><button type="button" class="btn tiny quiet" id="news-refresh">Refresh</button></header>
    <div id="news-desk-wrap" hidden>
      <h2>From the desk</h2>
      <div class="panel" style="padding:0"><ul class="dnlist" id="news-desk"></ul></div>
    </div>
    <div id="news-earn-wrap" hidden>
      <h2>Earnings today</h2>
      <div class="chips" id="news-earn"></div>
    </div>
    <h2>Headlines</h2>
    <div class="panel" style="padding:0 14px"><ul class="hl" id="news-list"></ul></div>
    <p class="said" id="news-said"></p>
  </section>

  <section class="page" data-page="history" id="pg-history" hidden>
    <header class="title"><div><h1 class="pt fl">HISTORY</h1><p class="ps" id="hist-sub">&nbsp;</p></div></header>
    <div class="panel" style="padding:0"><ul class="histlist" id="hist"></ul></div>
    <p class="said" id="hist-said"></p>
  </section>
</main>

<nav class="bar three" id="bar" hidden>
  <span class="ind" id="ind"></span>
  <button data-page="trades" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="lbl">Trades</span><span class="badge" id="bar-badge" hidden></span></button>
  <button data-page="news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H4z"/><path d="M17 8h3v9a2 2 0 0 1-2 2H6"/><path d="M7 9h7M7 12h7M7 15h5"/></svg><span class="lbl">News</span></button>
  <button data-page="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2"/><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/></svg><span class="lbl">History</span></button>
</nav>

<canvas id="fx"></canvas>
<div id="dimmer"></div>
<div id="flash"></div>
<div id="overlay"></div>
<div id="toasts"></div>
<div id="boot" class="boot">Opening PR 420&hellip;</div>

<script type="module" src="/js/admin-deskapp.js"></script>
<script type="module" src="/js/admin-presence.js"></script>
<script type="module" src="/js/version-note.js"></script>
</body>
</html>
