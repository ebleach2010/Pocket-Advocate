<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#060A1C">
<title>Availability · Pocket Advocate admin</title>
<script>
// Paint in the stored colour scheme before the stylesheet lands, so a scheme
// never flashes neon on the way in. Mirrors theme.js, which owns the choosing
// and persisting; this only applies what is already stored. Eric's admin
// device keeps Neon by default, everyone else gets Calm, and a stored choice
// always wins.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme');
    if (!s || ['neon', 'calm', 'paper', 'contrast'].indexOf(s) < 0)
      s = localStorage.getItem('pa-admin-device') === '1' ? 'neon' : 'calm';
    if (s !== 'neon') document.documentElement.dataset.scheme = s;
    var c = { neon: '#060A1C', calm: '#0B0E14', paper: '#F3EEE3', contrast: '#000000' }[s];
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && c) m.setAttribute('content', c);
  } catch (e) { /* storage blocked: neon is the default and is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=stat99">
<link rel="stylesheet" href="/css/admin.css?v=stat99">
<script type="module" src="/js/nav-menu.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/admin.html">Clients</a>
      <a href="/admin-calendar.html">Calendar</a>
      <a href="/admin-chats.html">Chats</a>
      <a href="/admin-availability.html" class="active">Availability</a>
      <a href="/admin-dictionary.html">📚 Terms</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <h1>Availability</h1>
  <p class="dim small">All times MST, a fixed UTC-7, year-round, 8am to 6pm. Clients can only book slots you open here, 72+ hours out.</p>

  <div class="panel" id="closure">
    <h3>Taking new cases</h3>
    <p class="dim small" id="closure-state" style="margin:.2rem 0 .7rem;">Checking…</p>
    <div class="actions" style="flex-wrap:wrap; gap:.4rem;">
      <button class="btn quiet" data-close-weeks="1">Close 1 week</button>
      <button class="btn quiet" data-close-weeks="2">Close 2 weeks</button>
      <button class="btn quiet" data-close-weeks="4">Close 4 weeks</button>
      <button class="btn" data-close-weeks="0">Reopen now</button>
    </div>
    <p class="error" id="closure-error" hidden></p>
  </div>

  <div class="panel">
    <h3>Open new slots</h3>
    <label>From <input type="date" id="from"></label>
    <label style="margin-top:.5rem;">Through <input type="date" id="to"></label>
    <label style="margin-top:.5rem;">Start times (MST, 60-minute sessions)</label>
    <div id="hours"></div>
    <label class="inline" style="margin-top:.5rem;"><input type="checkbox" id="weekdays" checked> Weekdays only</label>
    <p class="error" id="create-error" hidden></p>
    <p class="ok" id="create-ok" hidden></p>
    <div class="actions"><button class="btn" id="create">Open these slots</button></div>
  </div>

  <h2 style="margin-top:1.5rem;">The calendar</h2>
  <div id="calendar"><p class="dim">Loading…</p></div>
</main>
<script type="module" src="/js/admin-availability.js"></script>
<script type="module" src="/js/admin-presence.js"></script>
</body>
</html>
