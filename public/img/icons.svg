    </symbol>
  <symbol id="i-award" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.8" r="5.4"/><path d="M8.4 13.3L6.9 21l5.1-2.5L17.1 21l-1.5-7.7"/>
    </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20.3s-7.6-4.7-7.6-9.8A4.45 4.45 0 0 1 12 7.6a4.45 4.45 0 0 1 7.6 2.9c0 5.1-7.6 9.8-7.6 9.8z"/>
