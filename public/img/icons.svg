<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!-- The icon set, drawn once. Pages reference a symbol with
     <use href="/img/icons.svg#i-name">; a stroke icon inherits currentColor,
     so one shape serves every ink. Cached a day by public/_headers. -->
  <symbol id="i-brief" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="7" width="19" height="13" rx="2.5"/>
      <path d="M8.5 7V5.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V7M2.5 12.5h19"/>
    </symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 11.6c0 4.4-3.8 8-8.5 8a9.6 9.6 0 0 1-2.9-.45L4.2 20.6l1.4-4.05a7.8 7.8 0 0 1-1.6-4.95c0-4.42 3.8-8 8.5-8s8 3.58 8 8z"/>
      <path d="M8.8 11.6h6.4M8.8 8.9h6.4"/>
    </symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5l6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>
    </symbol>
  <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
      <path d="M14 3v5h5M9 13.5h6M9 17h4"/>
    </symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.2 18.2a4.5 4.5 0 0 1-.5-8.97 6 6 0 0 1 11.55 1.4 3.75 3.75 0 0 1-.75 7.57"/>
      <path d="M12 11.5v8.5M9 14.5l3-3 3 3"/>
    </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.8l7.5 2.9v5.6c0 4.6-3.1 8.5-7.5 9.6-4.4-1.1-7.5-5-7.5-9.6V5.7z"/>
      <rect x="9.4" y="10.9" width="5.2" height="4.6" rx="1.1"/>
      <path d="M10.7 10.9V9.6a1.3 1.3 0 0 1 2.6 0v1.3"/>
    </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.8 2.8L16.2 9.7"/>
    </symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/>
