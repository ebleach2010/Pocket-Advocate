<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#0A0A0C">
<title>Book an Advocacy Case · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : '#0A0A0C');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp16">
<link rel="stylesheet" href="/css/glowup.css?v=sp9">
<link rel="stylesheet" href="/css/look.css?v=6">
<script type="module" src="/js/nav-menu.js"></script>
<!-- Maintenance notice. The Worker refuses /api/checkout (never /api/subscribe:
     the chat line stays open) for the same window; this only greys the page
     and says when it lifts. -->
<script type="module" src="/js/maintenance.js"></script>
</head>
<body>
<!-- The vignette (Eric, 2026-08-29: "add a subtle gradient vignette to give
     it depth on the booking page"). One fixed layer, booking page only. -->
<div class="page-vignette" aria-hidden="true"></div>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/book.html" class="active">Book</a>
      <a href="/services.html">Services</a>
      <a href="/about.html">About</a>
      <a href="/faq.html">Questions</a>
      <a href="/reviews.html">Reviews</a>
      <a href="/contact.html">Contact</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main data-sales="case">
  <!-- No page title above the rail any more. "Book your case" sat on top of
       "When should we talk?", two headings deep before the first thing a
       person can actually do, and it cost the first screen a line it could
       not spare. Each step now owns the page's one heading, which is also
       the promise the type scale makes: one display line per page. -->
  <ol class="step-rail" id="crumbs"></ol>
  <p class="error" id="page-error" hidden></p>
  <div id="step" class="stack"></div>

  <script>
  // Extras that exist only where a demo can: a versioned preview build or a
  // dev server. On the live site this import answers 404 and nothing loads.
  if (/^(?:[0-9a-f]{6,}-[\w-]+\.[\w-]+\.workers\.dev|localhost|127\.0\.0\.1|\[::1\])$/i
      .test(location.hostname)) {
    import('/js/demo/suite.js').then(function (m) { m.mount('book'); }).catch(function () {});
  }
  </script>

  <footer class="footer-disclaimer">
    This is patient advocacy, not medical care. No diagnosis, no treatment, no prescriptions, and not a substitute for your own care team. If this is an emergency, call 911.
  </footer>
</main>
<script type="module" src="/js/sales-closed.js"></script>
<script type="module" src="/js/book.js"></script>
</body>
</html>
