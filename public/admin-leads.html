<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/pa-icon-192.png">
<link rel="apple-touch-icon" href="/img/pa-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#0A0A0C">
<title>Leads · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  // Blue and green past the home (Eric, 2026-10-17: "Change the standard
  // color for clients and advocates past the main page to green/blue that's
  // in settings"). Set first, so it stands even when storage is blocked;
  // Warm is the choice in Settings now.
  document.documentElement.dataset.look = 'cool';
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var cool = localStorage.getItem('pa-look') !== 'warm';
    if (!cool) delete document.documentElement.dataset.look;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : cool ? '#0A0A0C' : '#1E1519');
  } catch (e) { /* storage blocked: Blue and green stands */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp17">
<link rel="stylesheet" href="/css/admin.css?v=stat139">
<link rel="stylesheet" href="/css/look.css?v=8">
<link rel="stylesheet" href="/css/warm.css?v=5">

<style>
  /* The Leads tab (2026-10-14). One card per person (2026-10-17): the table ran
     off the side of his phone and took a lead's message with it ("It says my
     lead Rosemarie sent me a message but I don't see it"). Their words open
     under their name as a conversation, with a reply that goes to their email. */
  .leads-acts { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin: 0 0 1rem; }
  .lead-list { display: grid; gap: .8rem; }
  .lead-new-head { margin: .2rem 0 .1rem; color: var(--cyan); font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .lead-card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: .9rem 1rem; min-width: 0; }
  .lead-card.is-new { border-color: color-mix(in srgb, var(--cyan) 55%, transparent); }
  .lead-top { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .lead-name { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
  .lead-pill { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .lead-pill.new { background: color-mix(in srgb, var(--cyan) 16%, transparent); color: var(--cyan); border: 1px solid color-mix(in srgb, var(--cyan) 45%, transparent); }
  .lead-meta { margin: .3rem 0 .7rem; color: var(--dim); font-size: .86rem; overflow-wrap: anywhere; }
  .lead-acts { display: flex; gap: .5rem; flex-wrap: wrap; }
  .lead-msgs { margin-top: .8rem; border-top: 1px solid var(--line); padding-top: .3rem; }
  .lead-msgs > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: .45rem; min-height: 44px; font-weight: 700; color: var(--ink); }
  .lead-msgs > summary::-webkit-details-marker { display: none; }
  .lead-msgs > summary::after { content: "\203A"; margin-left: auto; font-size: 1.3rem; line-height: 1; color: var(--dim); transition: transform .15s ease; }
  .lead-msgs[open] > summary::after { transform: rotate(90deg); }
  .lead-thread { display: grid; gap: .55rem; margin: .3rem 0 .8rem; }
  .lm { max-width: 88%; padding: .6rem .75rem; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
  .lm.them { justify-self: start; background: color-mix(in srgb, var(--ink) 6%, transparent); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .lm.me { justify-self: end; background: color-mix(in srgb, var(--cyan) 14%, transparent); border: 1px solid color-mix(in srgb, var(--cyan) 40%, transparent); border-bottom-right-radius: 4px; }
  .lm-when { display: block; margin-top: .3rem; font-size: .72rem; color: var(--dim); white-space: normal; }
  .lead-reply { display: grid; gap: .5rem; }
  .lead-reply textarea { width: 100%; min-height: 5.5rem; resize: vertical; font: inherit; }
  .lead-reply .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  /* Hold a card to delete or block (2026-10-17): the press must not select the name or pop the phone's own menu. */
  .lead-card { -webkit-touch-callout: none; }
  .lead-top, .lead-meta { -webkit-user-select: none; user-select: none; }
  .lead-blocked { margin-top: 1.2rem; border-top: 1px solid var(--line); padding-top: .3rem; }
  .lead-blocked > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 700; color: var(--dim); }
  .lead-blocked-row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: .35rem 0; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .lead-msgs > summary::after { transition: none; } }
</style>
</head>

       information through any route gets added to a 'leads' tab. This is a
