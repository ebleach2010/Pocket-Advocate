<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/logo-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#0A0A0C">
<title>Leads · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : '#0A0A0C');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp16">
<link rel="stylesheet" href="/css/admin.css?v=stat138">
<link rel="stylesheet" href="/css/look.css?v=7">
<script type="module" src="/js/nav-menu.js"></script>
<style>
  /* The Leads tab (2026-10-14). A plain table that scrolls sideways inside its
     own box on a phone, so the page never does. */
  .leads-acts { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin: 0 0 1rem; }
  .leads-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .leads { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .leads th, .leads td { padding: .55rem .7rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .leads th { position: sticky; top: 0; background: var(--panel); color: var(--dim); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .leads td { color: var(--ink); white-space: nowrap; }
  .leads td.w { white-space: normal; }
  .leads td.n { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .leads td.w { min-width: 16rem; color: var(--dim); }
  .leads tr:last-child td { border-bottom: 0; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="/">Pocket<span class="spark">Advocate</span></a>
    <nav class="tabs">
      <a href="/admin.html">Clients</a>
      <a href="/admin-leads.html" class="active">Leads</a>
      <a href="/admin-calendar.html">Calendar</a>
      <a href="/admin-chats.html">Chats</a>
      <a href="/admin-dictionary.html">📚 Terms</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <!-- LEADS (Eric, 2026-10-14: "any person who has submitted their
       information through any route gets added to a 'leads' tab. This is a
       simple exportable csv that goes row by row for each potential
       client."). Built from /api/admin/leads; the CSV is made right here. -->
  <h1>Leads</h1>
  <p class="dim small">Everyone who has given you their details: the waitlist, the question box, free calls, booked cases and chat. One row per person, newest first.</p>
  <div class="leads-acts">
    <button type="button" class="btn glow" id="leads-csv" disabled>Download CSV</button>
    <span class="dim small" id="leads-count"></span>
  </div>
  <div id="leads"><p class="dim">Loading…</p></div>
</main>
<script type="module" src="/js/admin-leads.js"></script>
<script type="module" src="/js/admin-presence.js"></script>
</body>
</html>
