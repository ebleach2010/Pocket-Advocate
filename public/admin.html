<script>
// Paint in the stored colour scheme before the stylesheet lands, so a scheme
// never flashes neon on the way in. Mirrors theme.js, which owns the choosing
// and persisting; this only applies what is already stored. Eric's admin
// device keeps Neon by default, everyone else gets Calm, and a stored choice
// always wins.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme');
    if (!s || ['neon', 'calm', 'paper', 'contrast'].indexOf(s) < 0)
      s = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'calm' : 'neon';
    if (s !== 'neon') document.documentElement.dataset.scheme = s;
    var c = { neon: '#EAF2FA', calm: '#0A1626', paper: '#F3EEE3', contrast: '#000000' }[s];
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && c) m.setAttribute('content', c);
  } catch (e) { /* storage blocked: neon is the default and is already correct */ }
})();
</script>

</main>
<script>
// NEVER STUCK ON LOADING (Eric, 2026-09-24, 12:09 AM: "It's stuck loading in the
// client case menu on launch"). The shelf waits on the app's code, his sign-in,
// the case list, the covers and two small extras, and a phone waking from the
// background can leave any one of them waiting forever. This script waits on
// none of them. Twelve seconds with the shelf still unpainted reloads the page
// once; a second stall says which step it stopped on, with Try again.
window.__paStage = window.__paStage || 'code';
(function () {
  var WORDS = {
    code: "loading the app's code", signin: 'checking your sign-in', cases: 'reading your cases',
    covers: 'reading the case covers', extras: 'reading the rate and the voice study',
  };
  setTimeout(function () {
    if (window.__paStage === 'done') return;
    var tried = true;
    try { tried = sessionStorage.getItem('pa-list-retry') === '1'; } catch (e) { /* no storage: no reload loop either */ }
    if (!tried) {
      try { sessionStorage.setItem('pa-list-retry', '1'); } catch (e) { /* the reload still happens once */ }
      location.reload();
      return;
    }
    var el = document.getElementById('list');
    if (!el) return;
    el.innerHTML = '<p class="error" id="list-stuck">This is taking too long. Stuck on: <b></b>.</p><button type="button" class="btn" id="list-retry">Try again</button>';
    el.querySelector('#list-stuck b').textContent = WORDS[window.__paStage] || 'loading';
    document.getElementById('list-retry').addEventListener('click', function () { location.reload(); });
  }, 12000);
})();
</script>
