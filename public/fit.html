<!doctype html>
<html lang="en" data-default-scheme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/img/pa-icon-192.png">
<link rel="apple-touch-icon" href="/img/pa-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Advocate">
<meta name="theme-color" content="#1E1519">
<title>A free 15-minute call · Pocket Advocate</title>
<script>
// Every page is black now (Eric, 2026-10-15: "everywhere should have this
// same aesthetic"): the Night base, turned black by look.css. Somebody who
// chose High contrast for their eyes keeps it.
(function () {
  try {
    var s = localStorage.getItem('pa-scheme') === 'contrast' ? 'contrast' : 'calm';
    document.documentElement.dataset.scheme = s;
    // Warm is the look everywhere; blue and purple is a choice in Settings
    // (Eric, 2026-10-16: "Warm gradient we have going on should be default
    // everywhere, with the blue/purple being in settings").
    var cool = localStorage.getItem('pa-look') === 'cool';
    if (cool) document.documentElement.dataset.look = 'cool';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', s === 'contrast' ? '#000000' : cool ? '#0A0A0C' : '#1E1519');
  } catch (e) { /* storage blocked: the shipped default is already correct */ }
})();
</script>
<link rel="stylesheet" href="/css/site.css?v=sp17">
<link rel="stylesheet" href="/css/glowup.css?v=sp9">
<link rel="stylesheet" href="/css/look.css?v=8">

</head>

    <nav class="tabs">

      <a href="/contact.html">Contact</a>
      <span data-nav-auth></span>
    </nav>
  </div>
</header>
<main>
  <!-- The free 15-minute call (Eric, 2026-09-01). No account, no payment, no
       agreement: a person who has not decided anything yet is asked for one
       thing, a time, and then for how to reach them. fit.js renders every
       step into this one box. -->
  <p class="error" id="page-error" hidden></p>
  <div id="fit" class="stack"><p class="muted">Loading…</p></div>

  <footer class="footer-disclaimer">
    This is patient advocacy, not medical care. No diagnosis, no treatment, no prescriptions, and not a substitute for your own care team. If this is an emergency, call 911.
  </footer>
</main>
<script type="module" src="/js/fit.js"></script>
</body>
</html>
