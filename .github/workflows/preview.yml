# A driveable preview of a branch, without touching the live site.
#
# `wrangler versions upload` uploads a Worker version and gives it its own
# hostname — 445cd62a-pocket-advocate.<subdomain>.workers.dev — but does NOT
# route any traffic to it. thepocketadvocates.com keeps serving whatever is
# deployed from main until someone merges. So this is safe to run on any
# branch: it publishes something to look at, never something to land on.
#
# It exists because the preview link used to be produced by hand from a
# machine that happened to hold a Cloudflare token. The repository already
# holds the token, so the link may as well appear on its own with every push.
#
# The URL lands in three places: the job summary, the workflow log, and a
# comment on the pull request for the branch (one comment, edited in place, so
# a long-running branch does not collect a stack of them).
#
# Uses the same two secrets as deploy.yml and adds none.
name: Preview a branch

on:
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:

# One at a time per branch, and cancel a preview that a newer push has already
# made stale.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail with something readable rather than a wrangler auth error.
      - name: Check credentials are configured
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Upload a version
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      # wrangler prints "Version Preview URL: https://...workers.dev". Pull it
      # out of the command output rather than trying to rebuild it from the
      # version id, which would mean hard-coding the account subdomain here.
      - name: Find the preview URL
        id: url
        env:
          OUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url=$(printf '%s' "$OUT" | grep -oE 'https://[a-z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then
            echo "::warning::No preview URL in the wrangler output. The version uploaded; the link has to be read from the log."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Write the summary
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          {
            echo "## Preview"
            echo
            if [ -n "$URL" ]; then
              echo "Client side: [$URL/?demo=1]($URL/?demo=1)"
              echo
              echo "Advocate side: [$URL/admin?demo=admin]($URL/admin?demo=admin)"
              echo
              echo "Nothing is routed to this version. The live site is unchanged."
            else
              echo "The version uploaded, but the URL could not be read from the output. It is in the log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per branch, edited in place on every push.
      - name: Put the link on the pull request
        if: steps.url.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const url = process.env.URL;
            const branch = context.ref.replace('refs/heads/', '');
            const mark = '<!-- pocket-advocate-preview -->';
            const body = [
              mark,
              '### Preview',
              '',
              `**Client side:** ${url}/?demo=1`,
              '',
              `**Advocate side:** ${url}/admin?demo=admin`,
              '',
              `Built from \`${context.sha.slice(0, 7)}\` on \`${branch}\`. Nothing is routed to this`,
              'version, so the live site is unchanged until the branch is merged.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (!prs.data.length) {
              core.info('No open pull request for this branch; the summary has the link.');
              return;
            }
            for (const pr of prs.data) {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const mine = comments.data.find((c) => c.body?.includes(mark));
              if (mine) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: mine.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
