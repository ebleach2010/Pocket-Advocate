# Deploys the real app (Worker + the public/ assets it serves) to Cloudflare on
# every push to main, so "merged" and "live" mean the same thing.
#
# Note the sibling workflow pages.yml publishes only PROTOTYPE.html to the
# GitHub Pages review build — that is NOT the production site. This one is.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID from the Cloudflare dashboard
#
# Worker secrets (STRIPE_SECRET_KEY, FIREBASE_SERVICE_ACCOUNT, RESEND_API_KEY,
# STRIPE_WEBHOOK_SECRET) are stored in Cloudflare and survive deploys — they do
# not belong here and do not need to be re-uploaded.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail early with a readable message rather than a cryptic wrangler auth error.
      - name: Check credentials are configured
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
