# A MANUAL fallback. Nothing about the normal path runs through here.
#
# Cloudflare's own Git integration (Workers Builds) is connected to this
# repository and is what actually ships the app. It builds every push: a push
# to main is deployed to thepocketadvocates.com, and a push to any other branch
# is uploaded as a version and gets its own preview hostname, which the
# Cloudflare bot posts as a comment on the pull request. That is where the
# preview links come from.
#
# This workflow used to also run on every push to main. It has failed on every
# one of those since run 18, because the two secrets below were never added —
# while Cloudflare deployed the same commit successfully a minute later. A red
# cross that means nothing is worse than no check at all, so it now runs only
# when someone asks for it: a way back in if the Git integration is ever
# disconnected. It still needs the secrets to do anything.
#
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID on the Cloudflare dashboard sidebar
#
# (Settings → Secrets and variables → Actions.)
#
# Worker secrets (STRIPE_SECRET_KEY, FIREBASE_SERVICE_ACCOUNT, RESEND_API_KEY,
# STRIPE_WEBHOOK_SECRET) are stored in Cloudflare and survive deploys — they do
# not belong here and do not need to be re-uploaded.
#
# The sibling workflow pages.yml publishes only PROTOTYPE.html to the GitHub
# Pages review build. That is not the production site either.
name: Deploy to Cloudflare (manual fallback)

on:
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail early with a readable message rather than a cryptic wrangler auth error.
      - name: Check credentials are configured
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
